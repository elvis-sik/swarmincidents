<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Swarm Incidents</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F3F4F6;--ink:#0E1116;--muted:#6B7280;--line:#D3D7DE;--panel:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#0A0C10;--ink:#E8EBEF;--muted:#8B929C;--line:#323843;--panel:#111419}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
main{text-align:center}
img{width:48px;height:48px}
h1{font-size:20px;margin:18px 0 6px}
p{color:var(--muted);margin:0 0 22px}
a{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 14px;color:inherit;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <h1>Page not found</h1>
  <p>There's nothing at this address.</p>
  <a href="/">Go to the timeline</a>
</main>
</body>
</html>
