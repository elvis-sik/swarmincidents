name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sync:
    # docs/ must be what `python3 build.py` makes from template.html, incidents.json and wiki-data.js,
    # so a stale build cannot ship.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 build.py
      - name: docs/ is up to date
        run: |
          git diff --exit-code -- docs/
          test -z "$(git status --porcelain -- docs/)" || { git status --porcelain -- docs/; exit 1; }

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same image as `npm run test:visual` locally, so the Linux screenshot baselines match.
    # Keep the tag in step with @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: '1'
      VISUAL: '1'
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install the test runner through Socket Firewall
        run: |
          npm install -g sfw
          sfw npm ci --no-audit --no-fund
      - run: node --test tests/unit/analytics.cjs
      - run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
