<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0A0C10;color:#E8EBEF;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
.glow{position:absolute;right:-180px;top:-220px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(235,104,52,.20),rgba(235,104,52,0) 62%)}
.in{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font:500 22px/1 "JetBrains Mono",monospace;color:#B4BBC5}
.brand img{width:40px;height:40px}
h1{font-size:68px;line-height:1.04;letter-spacing:-.025em;font-weight:700;margin:52px 0 0;max-width:900px}
p{font-size:26px;line-height:1.4;color:#8B929C;margin:22px 0 0;max-width:860px}
svg.tl{position:absolute;left:72px;right:72px;bottom:48px;width:1056px;height:150px}
</style></head><body>
<div class="glow"></div>
<div class="in">
  <div class="brand"><img src="icon.svg" alt="">swarmincidents.com</div>
  <h1>A timeline of AI agent incidents</h1>
  <p>When AI agents reached systems and websites beyond what they were permitted, with sources.</p>
</div>
<svg class="tl" id="tl" viewBox="0 0 1056 150"></svg>
<script src="data.js"></script>
<script>
// Decorative strip drawn from the real data: one thin bar per activity window, disclosures as dots.
// The time window follows the data (first activity to last disclosure), and the rows share the
// strip's height, so it keeps working as incidents are added; past ~30 rows only the latest show.
const W = 1056, H = 150, MIN_ROW = 5;
const day = 864e5, t = d => Date.parse(d);
const reveal = inc => inc.reveals.filter(v => !v.minor)[0];
let rows = DATA.incidents.filter(i => i.activity.length).sort((a, b) => a.activity[0].s.localeCompare(b.activity[0].s));
rows = rows.slice(-Math.floor(H / MIN_ROW));
const first = new Date(Math.min(...rows.map(i => t(i.activity[0].s))));
const t0 = Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), 1);
const t1 = Math.max(...rows.flatMap(i => [...i.activity.map(a => t(a.e || a.s)), reveal(i) ? t(reveal(i).d) : 0])) + 12 * day;
const x = d => (t(d) - t0) / (t1 - t0) * W;
const gap = H / rows.length, bar = Math.min(5, Math.max(2, gap * 0.42)), dot = Math.min(5, Math.max(2.2, gap * 0.4));
let s = '';
for (let m = new Date(t0); m.getTime() <= t1; m.setUTCMonth(m.getUTCMonth() + 1)) {
  if (m.getTime() === t0) continue;
  const at = (m.getTime() - t0) / (t1 - t0) * W;
  s += `<line x1="${at}" x2="${at}" y1="0" y2="${H}" stroke="#22272E" stroke-width="1"/>`;
}
rows.forEach((inc, r) => {
  const y = r * gap + gap / 2;
  inc.activity.filter(a => !a.sub).forEach(a => {
    const a0 = x(a.s), a1 = Math.max(x(a.e || a.s), a0 + bar + 1);
    s += `<rect x="${a0}" y="${y - bar / 2}" width="${a1 - a0}" height="${bar}" rx="${bar / 2}" fill="#5A616B"/>`;
  });
  const rev = reveal(inc);
  const end = Math.max(...inc.activity.map(a => x(a.e || a.s)));
  if (rev && x(rev.d) - end > 12) s += `<line x1="${end + 5}" x2="${x(rev.d) - dot - 3}" y1="${y}" y2="${y}" stroke="#3A414B" stroke-width="1.2" stroke-dasharray="2 4" stroke-linecap="round"/>`;
  if (rev) s += `<circle cx="${x(rev.d)}" cy="${y}" r="${dot}" fill="#EB6834"/>`;
});
document.getElementById('tl').innerHTML = s;
</script>
</body></html>
